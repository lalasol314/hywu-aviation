- q: "항공과는 몇 년제인가요?"
  a: "2년제 전문학사 과정입니다. 졸업 후 학사학위 전공심화과정을 통해 학사학위 취득도 노려볼 수 있어요."
- q: "입시는 어떻게 평가하나요?"
  a: "수시 일반전형(면접)은 학생부 40% + 면접 60%로 선발합니다. 정확한 내용은 반드시 입학처 모집요강을 확인해 주세요."
- q: "다른 면접 학과와 복수지원이 되나요?"
  a: "면접·실기 학과끼리는 복수지원이 불가합니다(예: 항공과 + 호텔관광과 X). 면접 학과 + 일반 학과 조합은 가능합니다."
- q: "어떤 자격증을 딸 수 있나요?"
  a: "항공예약·발권, DCS, SMAT, CS리더스관리사, CPR, 와인 소믈리에, 바리스타, 조주기능사, 컴퓨터활용능력, MOS, 무인동력비행장치 자격증 등을 재학 중 준비할 수 있어요."
- q: "학교는 어디에 있나요?"
  a: "서울 성동구 행당동, 2호선 한양대역과 왕십리역 가까이에 있어 통학이 편리합니다."
